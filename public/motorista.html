<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Motorista — Agente RIT</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan: #00D1FF;
      --gold: #FF8A00;
      --dark: #050A0F;
      --panel-bg: rgba(10, 18, 30, 0.7);
      --glass-border: rgba(0, 209, 255, 0.15);
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --good: #10B981;
      --danger: #EF4444;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 209, 255, 0.08) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      z-index: -1;
    }
    .bg-glow-right {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 138, 0, 0.06) 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--panel-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      margin-top: 10px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header img {
      height: 32px;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .section-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 4px;
    }

    .card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .data-row:last-child {
      margin-bottom: 0;
    }

    .data-label {
      color: var(--text-muted);
    }

    .data-val {
      font-weight: 600;
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(0, 209, 255, 0.15);
      color: var(--cyan);
    }

    /* Status Indicator */
    .status-panel {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .status-standby {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }
    .status-active {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--good);
      color: var(--good);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }
    .status-active .pulse-dot {
      background: var(--good);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulseGlow 1.5s infinite;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 10px var(--good); }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      font-family: 'Outfit', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(90deg, #00D1FF, #FF8A00);
      color: #04111a;
      box-shadow: 0 4px 15px rgba(0, 209, 255, 0.2);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 209, 255, 0.35);
    }

    .btn-success {
      background: var(--good);
      color: #04111a;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
    }
    .btn-success:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
    }
    .btn-danger:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 24px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-right"></div>

  <div class="container">
    <div class="header">
      <img src="assets/rit-hero.png" alt="RIT">
      <h1>Agente RIT</h1>
      <p>CENTRO DE COMANDO & LOGÍSTICA GLOBO</p>
    </div>

    <!-- Status de Transmissão -->
    <div id="status-box" class="status-panel status-standby">
      <span id="status-text">AGUARDANDO INÍCIO</span>
    </div>

    <!-- Dados do Motorista -->
    <div class="section-title">Confirmação de Dados do Motorista</div>
    <div class="card">
      <div class="data-row">
        <span class="data-label">Nome:</span>
        <span id="m-nome" class="data-val">—</span>
      </div>
      <div class="data-row">
        <span class="data-label">Placa:</span>
        <span id="m-placa" class="data-val">—</span>
      </div>
      <div class="data-row">
        <span class="data-label">Veículo:</span>
        <span id="m-veiculo" class="data-val">—</span>
      </div>
    </div>

    <!-- Dados do Atendimento -->
    <div class="section-title">Dados do Atendimento (Corrida)</div>
    <div class="card">
      <div class="data-row">
        <span class="data-label">Passageiro:</span>
        <span id="r-passageiro" class="data-val">—</span>
      </div>
      <div class="data-row">
        <span class="data-label">Programa:</span>
        <span id="r-programa" class="data-val"><span class="badge">—</span></span>
      </div>
      <div class="data-row">
        <span class="data-label">Destino:</span>
        <span id="r-destino" class="data-val">—</span>
      </div>
      <div class="data-row">
        <span class="data-label">Início Sugerido:</span>
        <span id="r-inicio" class="data-val">—</span>
      </div>
      <div class="data-row">
        <span class="data-label">Término Previsto:</span>
        <span id="r-termino" class="data-val">—</span>
      </div>
    </div>

    <!-- Controles -->
    <div style="margin-top: 10px;">
      <button id="btn-gps" class="btn btn-primary">🛰️ AUTORIZAR GPS & COMPARTILHAMENTO</button>
      <button id="btn-start" class="btn btn-success" disabled>▶️ INICIAR ATENDIMENTO (EM VIAGEM)</button>
      <button id="btn-pause" class="btn" style="background: var(--gold); color: #000; display: none;" disabled>⏸️ PAUSAR COMPARTILHAMENTO DE GPS</button>
      <button id="btn-stop" class="btn btn-danger" disabled>⏹️ FINALIZAR ATENDIMENTO (CHEGADA)</button>
    </div>

    <div class="footer">
      © 2026 GLOBO Equipe de Transportes — AGENTE RIT
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tokenRota = urlParams.get('token');
    
    let trackerActive = false;
    let gpsWatchId = null;
    let currentCoords = null;
    let rotaData = null;

    // Silent audio to keep background tracking alive on mobile iOS/Android
    const silentAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
    silentAudio.loop = true;

    // Elementos da tela
    const btnGps = document.getElementById('btn-gps');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');
    const statusBox = document.getElementById('status-box');
    const statusText = document.getElementById('status-text');

    if (!tokenRota) {
      exibirMensagemLinkInvalido("Link de acesso não especificado ou incompleto. Entre em contato com o supervisor responsável pela operação.");
    } else {
      carregarDetalhesRota();
    }

    function exibirMensagemLinkInvalido(msg) {
      statusBox.className = "status-panel status-standby";
      statusBox.style.background = "rgba(239, 68, 68, 0.15)";
      statusBox.style.border = "1px solid var(--danger)";
      statusBox.style.color = "#FF8B8B";
      if (statusText) statusText.textContent = "LINK DE ATENDIMENTO EXPIRADO / INVÁLIDO";
      
      btnGps.disabled = true;
      btnStart.disabled = true;
      btnPause.disabled = true;
      btnStop.disabled = true;

      const containerCard = document.querySelector('.container');
      if (containerCard) {
        const errorNotice = document.createElement('div');
        errorNotice.className = 'card';
        errorNotice.style.border = '1px solid var(--danger)';
        errorNotice.style.background = 'rgba(239, 68, 68, 0.1)';
        errorNotice.style.color = '#fff';
        errorNotice.style.marginTop = '15px';
        errorNotice.style.textAlign = 'center';
        errorNotice.style.fontSize = '14px';
        errorNotice.style.lineHeight = '1.5';
        errorNotice.textContent = msg || "Este link não está mais disponível. Entre em contato com o supervisor responsável pela operação.";
        containerCard.appendChild(errorNotice);
      }
    }

    async function carregarDetalhesRota() {
      try {
        const res = await fetch(`/api/motorista/atendimento?token=${encodeURIComponent(tokenRota)}`);
        const data = await res.json();

        if (!res.ok || !data.ok || !data.atendimento) {
          exibirMensagemLinkInvalido(data.mensagem || "Este link não está mais disponível. Entre em contato com o supervisor responsável pela operação.");
          return;
        }

        rotaData = data.atendimento;
        preencherCamposDOM(rotaData);
        restaurarEstadoPersistido();
      } catch (err) {
        console.error("Erro ao carregar dados do atendimento:", err);
        exibirMensagemLinkInvalido("Erro de conexão ao carregar os dados do atendimento. Verifique sua internet.");
      }
    }

    function preencherCamposDOM(d) {
      const elNome = document.getElementById('m-nome');
      const elPlaca = document.getElementById('m-placa');
      const elVeiculo = document.getElementById('m-veiculo');
      const elPassageiro = document.getElementById('r-passageiro');
      const elPrograma = document.getElementById('r-programa');
      const elDestino = document.getElementById('r-destino');
      const elInicio = document.getElementById('r-inicio');
      const elTermino = document.getElementById('r-termino');

      if (elNome) elNome.textContent = d.motorista_nome || 'N/D';
      if (elPlaca) elPlaca.textContent = d.placa_veiculo || 'N/D';
      if (elVeiculo) elVeiculo.textContent = d.tipo_veiculo || 'N/D';
      if (elPassageiro) elPassageiro.textContent = d.passageiro_resumido || d.passageiro || 'Passageiro / Equipe';
      if (elPrograma) {
        elPrograma.textContent = '';
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = d.programa || 'GERAL';
        elPrograma.appendChild(badge);
      }
      if (elDestino) elDestino.textContent = d.destino || 'N/D';
      if (elInicio) elInicio.textContent = d.horario || 'N/D';
      if (elTermino) elTermino.textContent = d.horario_termino || 'N/D';
    }

    function restaurarEstadoPersistido() {
      if (!tokenRota) return;
      
      const gpsAuthorized = localStorage.getItem('gps_authorized_' + tokenRota) === 'true';
      const tripActive = localStorage.getItem('trip_active_' + tokenRota) === 'true';

      if (gpsAuthorized) {
        btnStart.disabled = false;
        btnGps.innerHTML = "🛰️ GPS AUTORIZADO";
        btnGps.style.background = "rgba(16, 185, 129, 0.2)";
        btnGps.style.border = "1px solid var(--good)";
        btnGps.style.color = "var(--good)";
        btnGps.disabled = true;
      }

      if (tripActive) {
        iniciarRastreamento();
      }
    }

    btnGps.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("Geolocalização não é suportada por este navegador.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          alert("Autorização do GPS concedida com sucesso!");
          btnStart.disabled = false;
          btnGps.innerHTML = "🛰️ GPS AUTORIZADO";
          btnGps.style.background = "rgba(16, 185, 129, 0.2)";
          btnGps.style.border = "1px solid var(--good)";
          btnGps.style.color = "var(--good)";
          btnGps.disabled = true;

          if (tokenRota) {
            localStorage.setItem('gps_authorized_' + tokenRota, 'true');
          }
        },
        (err) => {
          console.error(err);
          alert("Por favor, ative e autorize o compartilhamento de localização/GPS no seu dispositivo.");
        },
        { enableHighAccuracy: true }
      );
    });

    btnStart.addEventListener('click', () => {
      iniciarRastreamento();
    });

    function iniciarRastreamento() {
      if (!rotaData || !tokenRota) return;

      trackerActive = true;
      btnStart.style.display = "none";
      btnPause.style.display = "inline-flex";
      btnPause.disabled = false;
      btnStop.disabled = false;

      statusBox.className = "status-panel status-active";
      statusBox.innerHTML = '<div class="pulse-dot"></div><span id="status-text">TRANSMITINDO GPS ONLINE</span>';

      if (tokenRota) {
        localStorage.setItem('trip_active_' + tokenRota, 'true');
      }

      // Play background keeping silent loop
      try {
        silentAudio.play().catch(e => console.log("Áudio pendente de interação:", e));
      } catch(e) {}

      // Get initial position immediately
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
          enviarPosicao('EM_TRANSITO', speed);
        },
        (err) => console.error(err),
        { enableHighAccuracy: true }
      );

      // Continuous tracking
      if (gpsWatchId) {
        navigator.geolocation.clearWatch(gpsWatchId);
      }
      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          currentCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
          enviarPosicao('EM_TRANSITO', speed);
        },
        (err) => {
          console.error("Erro na leitura contínua do GPS:", err);
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    }

    // Attempt audio activation on touch to guarantee background loop works
    document.body.addEventListener('click', () => {
      if (trackerActive && silentAudio.paused) {
        silentAudio.play().catch(e => {});
      }
    });

    btnPause.addEventListener('click', async () => {
      if (gpsWatchId) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      try {
        silentAudio.pause();
      } catch(e) {}

      trackerActive = false;
      btnPause.style.display = "none";
      btnStart.style.display = "inline-flex";
      btnStart.disabled = false;
      btnPause.disabled = true;

      statusBox.className = "status-panel status-standby";
      statusBox.innerHTML = '<span id="status-text">TRANSMISSÃO INTERROMPIDA</span>';

      if (tokenRota) {
        localStorage.removeItem('trip_active_' + tokenRota);
      }

      await enviarPosicao('PAUSADO');
      alert("Transmissão de GPS interrompida temporariamente.");
    });

    btnStop.addEventListener('click', async () => {
      if (confirm("Deseja realmente finalizar o atendimento?")) {
        if (gpsWatchId) {
          navigator.geolocation.clearWatch(gpsWatchId);
          gpsWatchId = null;
        }
        try {
          silentAudio.pause();
        } catch(e) {}

        trackerActive = false;
        btnStart.style.display = "inline-flex";
        btnStart.disabled = true;
        btnPause.style.display = "none";
        btnPause.disabled = true;
        btnStop.disabled = true;
        
        statusBox.className = "status-panel status-standby";
        statusBox.innerHTML = '<span id="status-text">ATENDIMENTO FINALIZADO</span>';

        if (tokenRota) {
          localStorage.removeItem('trip_active_' + tokenRota);
          localStorage.removeItem('gps_authorized_' + tokenRota);
        }

        // Tenta enviar última posição GPS se houver coordenadas ativas
        if (currentCoords) {
          try {
            await enviarPosicao('FINALIZADO');
          } catch(e) {}
        }

        // Chama OBRIGATORIAMENTE o endpoint de finalização garantida no servidor
        try {
          await fetch('/api/motorista/finalizar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: tokenRota })
          });
        } catch (err) {
          console.error("Erro ao chamar endpoint de finalização:", err);
        }

        exibirMensagemLinkInvalido("O atendimento foi finalizado e este link de compartilhamento foi encerrado.");
        alert("Corrida finalizada com sucesso. O link de compartilhamento foi encerrado.");
      }
    });

    async function enviarPosicao(statusAtendimento, speed = 0) {
      if (!tokenRota) return;

      const payload = {
        token: tokenRota,
        motorista: rotaData ? rotaData.motorista_nome : undefined,
        lat: currentCoords ? currentCoords.lat : 0,
        lng: currentCoords ? currentCoords.lng : 0,
        placa: rotaData ? rotaData.placa_veiculo : undefined,
        tipo_veiculo: rotaData ? rotaData.tipo_veiculo : undefined,
        programa: rotaData ? rotaData.programa : undefined,
        speed: speed,
        status_atendimento: statusAtendimento
      };

      try {
        const res = await fetch('/api/gps/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.erro === 'ATENDIMENTO_FINALIZADO' || data.erro === 'LINK_EXPIRADO') {
          if (gpsWatchId) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
          }
          trackerActive = false;
          statusBox.className = "status-panel status-standby";
          statusBox.style.background = "rgba(239, 68, 68, 0.15)";
          statusBox.style.border = "1px solid var(--danger)";
          if (statusText) statusText.textContent = "ATENDIMENTO FINALIZADO";
          
          btnStart.disabled = true;
          btnPause.disabled = true;
          btnStop.disabled = true;

          if (tokenRota) {
            localStorage.removeItem('trip_active_' + tokenRota);
            localStorage.removeItem('gps_authorized_' + tokenRota);
          }
        }
      } catch (err) {
        console.error("Erro ao enviar dados para a API:", err);
      }
    }
  </script>
</body>
</html>
